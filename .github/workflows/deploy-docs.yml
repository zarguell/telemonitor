name: Deploy docs

on:
  # Rebuild when the docs site changes.
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/deploy-docs.yml
  # Manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow at most one concurrent deploy, but don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: website
        env:
          # https://zarguell.github.io/telemonitor/ by default. Override with
          # repo vars SITE / BASE_PATH if the site moves to a custom domain;
          # the workflow passes them straight through to the Astro build.
          SITE: ${{ vars.SITE || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
